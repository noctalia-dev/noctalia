name: Feature Request
description: Suggest an improvement, new feature, or enhancement for Noctalia
title: "[FEATURE] "
labels: ["feature"]

body:
  - type: markdown
    attributes:
      value: |
        Noctalia core keeps a narrow scope. Read [SCOPE.md](https://github.com/noctalia-dev/noctalia/blob/main/SCOPE.md) before opening a request. Ideas and questions are faster on [Discord](https://discord.noctalia.dev). Requests that belong in a plugin or fall outside scope are closed with a pointer, which is not a verdict on the idea.

  - type: checkboxes
    id: submission-checklist
    attributes:
      label: Submission checklist
      description: Please confirm the following before submitting.
      options:
        - label: I have searched existing issues and confirmed this has not been requested before.
          required: true
        - label: I have checked existing pull requests for similar changes.
          required: true
        - label: I have read SCOPE.md. This cannot already be done with existing configuration, IPC, a script-backed widget, or a plugin.
          required: true

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature type
      description: What kind of feature or improvement is this?
      options:
        - UI / visual improvement
        - New functionality
        - Performance improvement
        - Configuration / customization
        - Accessibility improvement
        - Developer / API improvement
        - Integration support
        - Documentation improvement
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Feature summary
      description: A concise description of the feature or enhancement.
      placeholder: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / use case
      description: |
        Why would this feature be useful?
        What problem does it solve or improve?
      placeholder: Explain the benefit or real-world use case...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: |
        Describe how you think this could work.

        Mockups, examples, screenshots, or references are welcome.
      placeholder: Describe your idea...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Have you considered any alternative solutions or workarounds?
      placeholder: Optional...

  - type: textarea
    id: references
    attributes:
      label: References / related projects
      description: |
        Link any related projects, concepts, screenshots, issues, or examples here.
      placeholder: |
        https://github.com/...
        https://example.com/...

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Add any additional information, screenshots, mockups, or context here.