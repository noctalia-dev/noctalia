pre-commit:
  jobs:
    - name: clang-format
      glob: "*.{cpp,h}"
      run: cd "$(git rev-parse --show-toplevel)" && just format-code && git update-index --again
    - name: docs-format
      glob: "*.{md,mdx}"
      run: cd "$(git rev-parse --show-toplevel)" && just format-docs && git update-index --again
